name: ci
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - run: node scripts/make-proof.js ci-check --no-screens
      - name: contract smoke run
        run: |
          node src/headless.js --seed 1 --night 1 --ticks 600 --out out.jsonl
          tail -n 1 out.jsonl
